services:
  postgres:
    image: postgres:16-alpine
    container_name: wifimon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Start PostgreSQL with scripts/start_postgres.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Start PostgreSQL with scripts/start_postgres.py}
      POSTGRES_DB: ${POSTGRES_DB:?Start PostgreSQL with scripts/start_postgres.py}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - wifimon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  wifimon-postgres-data:
